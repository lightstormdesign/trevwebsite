<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <script>
          /* Safari edge test (?edge=a..d): which layout iOS 26 Safari draws behind its bars. Replaces the page; temporary */
          (function () {
            var m = location.search.match(/[?&]edge=([abcd])/); if (!m) return;
            var img = "/journey/trev-hero-mobile-poster.jpg", k = m[1], css = "", body = "";
            var tag = function (t) { return '<div class="tag" style="position:fixed">' + t + '<\/div>'; };
            if (k === "a") { css = "img{display:block;width:100%;height:120vh;object-fit:cover}"; body = '<img src="' + img + '">' + tag("A: normal page (scrolls)") + '<div style="height:60vh"><\/div>'; }
            if (k === "b") { css = ".f{position:fixed;inset:0;background:url(" + img + ") center/cover}"; body = '<div class="f"><\/div>' + tag("B: fixed full-screen"); }
            if (k === "c") { css = ".f{position:fixed;inset:0;background:url(" + img + ") center/cover}"; body = '<div class="f"><\/div>' + tag("C: fixed, tall page") + '<div style="height:300vh"><\/div>'; }
            if (k === "d") { css = "html{background:#26303a url(" + img + ") center top/cover no-repeat fixed;min-height:100%}body{background:transparent!important}"; body = tag("D: page background") + '<div style="height:300vh"><\/div>'; }
            document.title = "Edge " + k.toUpperCase();
            document.write('<style>html,body{margin:0;background:#26303a;color:#fff;font:600 16px/1.3 system-ui}.tag{left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);padding:10px 16px;border-radius:10px}' + css + '<\/style>' + body + '<plaintext hidden style="display:none">');   /* (everything after this is just text: the site never loads) */
          })();
        </script>
        <!-- (no theme-color: iOS Safari would paint its status bar and toolbar in it, flat, instead of drawing the page behind them) -->
        <meta name="description" content="TREV - Music for the Kingdom Within. Conscious hip-hop, spoken word, and prayerformance from Salt Lake City, Utah." />
        <!-- the sword (TREV's wordmark is unreadable at tab size); ?v= busts the browsers' icon cache -->
        <link rel="icon" href="/favicon.ico?v=9" sizes="any" />
        <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png?v=9" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=9" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=9" />
        <!-- Open Graph / social share -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="TREV" />
        <meta property="og:title" content="TREV - Music for the Kingdom Within" />
        <meta property="og:description" content="Conscious hip-hop, spoken word, and prayerformance. The Kingdom is Within You." />
        <meta property="og:url" content="https://trevworld.com/" />
        <meta property="og:image" content="https://trevworld.com/trev-share.jpg?v=1" />
        <meta property="og:image:secure_url" content="https://trevworld.com/trev-share.jpg?v=1" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="TREV in Sedona, beneath his golden TREV logo" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="TREV - Music for the Kingdom Within" />
        <meta name="twitter:description" content="Conscious hip-hop, spoken word, and prayerformance. The Kingdom is Within You." />
        <meta name="twitter:image" content="https://trevworld.com/trev-share.jpg?v=1" />

        <title>TREV - Music for the Kingdom Within</title>
