<title>TREV Hero Loop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Outfit:wght@300;400&display=swap">
<style>
  /* Full-bleed hero: animated plate (locked after the opening settle) + TREV's real cutout, warped in WebGL */
  :root {
    --night: #0c0b0a;
    --bone: #f1e9dc;
    --gold: #e7c98f;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: "Outfit", -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; background: var(--night); color: var(--bone); overflow: hidden; }
  body { font-family: var(--body); }
  #stage { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
  #box { position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 0; transition: opacity .6s ease; }
  #box.ready { opacity: 1; }
  #plate, #me, #meImg { position: absolute; left: 0; top: 0; max-width: none; display: block; }
  #plate { object-fit: fill; transform-origin: 50% 50%; will-change: transform; }
  #me, #meImg { transition: opacity .6s ease; }
  .gone { opacity: 0 !important; }
  /* header: only a soft shadow band, the name left, the menu right */
  #header { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
            padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: 46px;
            padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
            background: linear-gradient(to bottom, rgba(6,5,4,.62) 0%, rgba(6,5,4,.28) 55%, rgba(6,5,4,0) 100%); }
  #name { font: 500 clamp(15px, 1.25vw, 18px)/1 var(--display); letter-spacing: .42em; color: var(--bone);
          text-shadow: 0 1px 12px rgba(0,0,0,.45); }
  #menuBtn { width: 44px; height: 44px; display: grid; place-content: center; gap: 6px; background: none; border: 0; cursor: pointer; padding: 0; }
  #menuBtn span { display: block; width: 24px; height: 1.5px; background: var(--bone); box-shadow: 0 1px 6px rgba(0,0,0,.4); }
  #menuBtn:focus-visible, #enter:focus-visible { outline: 1px solid var(--gold); outline-offset: 6px; }
  #menu { position: absolute; inset: 0; z-index: 3; background: rgba(8,7,6,.92); display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 26px; }
  #menu[hidden] { display: none; }
  #menu a { font: 500 18px/1 var(--display); letter-spacing: .32em; color: var(--bone); text-decoration: none; }
  #menu a:hover { color: var(--gold); }
  #menuClose { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
               width: 44px; height: 44px; background: none; border: 0; color: var(--bone); font: 300 30px/1 var(--body); cursor: pointer; }
  /* "Tap to enter": gold-gradient words floating above his head, no button chrome */
  #enter { position: absolute; left: 0; top: 0; z-index: 1; background: none; border: 0; padding: 10px 6px; cursor: pointer;
           opacity: 0; pointer-events: none; transition: opacity 1.2s ease; filter: drop-shadow(0 0 1px rgba(40,24,6,.55)) drop-shadow(0 1px 14px rgba(0,0,0,.6)); }
  #enter span { font: 600 clamp(20px, 1.7vw, 24px)/1 var(--display); letter-spacing: .3em; text-transform: uppercase; white-space: nowrap;
                background: linear-gradient(180deg, #f8e0a2 0%, #e2b45c 42%, #b98530 72%, #e9c47c 100%);
                -webkit-background-clip: text; background-clip: text; color: transparent; }
  #enter.show { opacity: 1; pointer-events: auto; }
  #note { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(7svh + env(safe-area-inset-bottom, 0px));
          font-size: 12px; letter-spacing: .08em; opacity: 0; transition: opacity .4s; text-shadow: 0 1px 10px #000;
          white-space: nowrap; pointer-events: none; }
  #note.on { opacity: .85; }
  @media (prefers-reduced-motion: reduce) { #me, #meImg, #enter { transition: none; } }
</style>

<div id="stage">
  <div id="box">
    <video id="plate" muted loop playsinline autoplay preload="auto"></video>
    <canvas id="me"></canvas>
    <img id="meImg" alt="TREV" hidden>
  </div>
  <header id="header">
    <span id="name">TREV</span>
    <button id="menuBtn" type="button" aria-label="Open menu"><span></span><span></span><span></span></button>
  </header>
  <nav id="menu" hidden>
    <button id="menuClose" type="button" aria-label="Close menu">&times;</button>
    <a href="#">Music</a><a href="#">About</a><a href="#">Tour</a><a href="#">Community</a><a href="#">EPK</a><a href="#">Shop</a><a href="#">Contact</a>
  </nav>
  <div id="note">The transition video would start here</div>
  <button id="enter" type="button"><span>Tap to enter</span></button>
</div>

<script>
// Each version: the loop's size, where TREV's cutout sits on it (in loop pixels), and the
// point of the frame to keep in view when the screen crops it.
const SETS = {
  desktop: { w: 1920, h: 1740, video: "trev-hero-desktop.mp4", poster: "trev-hero-desktop-poster.jpg",
             cut: { src: "trev-hero-cutout-desktop.webp", x: 580, y: 927, w: 923, h: 813 }, headX: 966, fx: 0.5, fy: 0.8 },
  mobile:  { w: 1080, h: 1920, video: "trev-hero-mobile.mp4", poster: "trev-hero-mobile-poster.jpg",
             cut: { src: "trev-hero-cutout-mobile.webp", x: 91, y: 1023, w: 989, h: 897 }, headX: 516, fx: 0.48, fy: 0.55 },
};
const INTRO_S = 3;          // the background settles into place over this long, then never moves again
const INTRO_ZOOM = 0.05;    // how far it starts pushed in
const INTRO_SHIFT = 22;     // screen px the background still follows the pointer/tilt during the settle
const HEAD_PX = 13;         // screen px TREV's head travels at full tilt (his base stays pinned)
const TILT_DEG = 9;         // phone tilt (degrees from where it's held) that gives full travel
const MARGIN = 70;          // canvas room around the cutout for the head to move into (loop px)
const ENTER_GAP = 30;       // screen px between the top of his hair and "Tap to enter"

const box = document.getElementById("box"), plate = document.getElementById("plate");
const canvas = document.getElementById("me"), meImg = document.getElementById("meImg");
const enter = document.getElementById("enter");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let set = null, fit = { k: 1, ox: 0, oy: 0 }, gl = null, prog = null, tex = null, nIdx = 0, uOff, uBreath;

// ---------- TREV: his real cutout drawn on a mesh; the top moves, edges touching the frame stay put ----------
function initGL() {
  gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: true });
  if (!gl) return false;
  const vs = `attribute vec2 p; attribute vec2 uv; attribute vec2 w; uniform vec2 off; uniform float breath; uniform vec2 size;
    varying vec2 v; void main(){ vec2 q = p + off * w + vec2(0.0, -breath * w.y);
    gl_Position = vec4(q.x / size.x * 2.0 - 1.0, 1.0 - q.y / size.y * 2.0, 0.0, 1.0); v = uv; }`;
  const fs = `precision mediump float; varying vec2 v; uniform sampler2D t; void main(){ gl_FragColor = texture2D(t, v); }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { gl = null; return false; }
  gl.useProgram(prog);
  uOff = gl.getUniformLocation(prog, "off"); uBreath = gl.getUniformLocation(prog, "breath");
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  return true;
}

function buildMesh(img) {
  const c = set.cut, N = 48, CW = c.w + 2 * MARGIN, CH = c.h + MARGIN;
  canvas.width = CW; canvas.height = CH;
  Object.assign(canvas.style, { left: c.x - MARGIN + "px", top: c.y - MARGIN + "px", width: CW + "px", height: CH + "px" });
  gl.viewport(0, 0, CW, CH);
  gl.uniform2f(gl.getUniformLocation(prog, "size"), CW, CH);
  const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const data = [], idx = [];
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const u = i / N, v = j / N, fx = c.x + u * c.w, fy = c.y + v * c.h;            // position in the loop frame
    const lift = Math.pow(ss(0.04, 0.85, 1 - v), 1.25);                              // 0 at his base, 1 at the head
    const pinX = ss(0, 110, fx) * ss(0, 110, set.w - fx);                            // stay glued to the frame's sides
    const pinY = ss(0, 110, set.h - fy);                                             // and to its bottom
    data.push(MARGIN + u * c.w, MARGIN + v * c.h, u, v, lift * pinX, lift * pinY);
  }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i; idx.push(a, a + 1, a + N + 1, a + 1, a + N + 2, a + N + 1);
  }
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  nIdx = idx.length;
  const at = (name, n, o) => { const l = gl.getAttribLocation(prog, name); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, n, gl.FLOAT, false, 24, o); };
  at("p", 2, 0); at("uv", 2, 8); at("w", 2, 16);
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  for (const [p, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, p, v);
}

function drawMe(offX, offY, breath) {
  if (!gl) return;
  gl.uniform2f(uOff, offX, offY); gl.uniform1f(uBreath, breath);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawElements(gl.TRIANGLES, nIdx, gl.UNSIGNED_SHORT, 0);
}

// ---------- which version, and how it fills the screen ----------
function pick() {
  const portrait = innerWidth / innerHeight < 0.9;
  const next = portrait ? SETS.mobile : SETS.desktop;
  if (next === set) return;
  set = next;
  box.classList.remove("ready");
  box.style.width = set.w + "px"; box.style.height = set.h + "px";
  Object.assign(plate.style, { width: set.w + "px", height: set.h + "px" });
  plate.poster = set.poster; plate.src = set.video;
  plate.play().catch(() => {});                       // Low Power Mode: the poster (first frame) stays
  let loaded = 0; const done = () => { if (++loaded === 2) box.classList.add("ready"); };
  const p = new Image(); p.onload = done; p.onerror = done; p.src = set.poster;
  const img = new Image();
  img.onload = () => {
    if (gl || initGL()) { buildMesh(img); canvas.hidden = false; meImg.hidden = true; }
    else {                                            // no WebGL: plain still cutout
      canvas.hidden = true; meImg.hidden = false; meImg.src = img.src;
      Object.assign(meImg.style, { left: set.cut.x + "px", top: set.cut.y + "px", width: set.cut.w + "px", height: set.cut.h + "px" });
    }
    done();
  };
  img.src = set.cut.src;
}
function layout() {
  pick();
  const W = innerWidth, H = innerHeight, k = Math.max(W / set.w, H / set.h);
  fit = { k,
    ox: Math.min(0, Math.max(W - set.w * k, W / 2 - set.fx * set.w * k)),
    oy: Math.min(0, Math.max(H - set.h * k, H / 2 - set.fy * set.h * k)) };
  box.style.transform = `translate(${fit.ox}px, ${fit.oy}px) scale(${k})`;
  // "Tap to enter" sits centred over his head, just above his hair
  const hx = fit.ox + set.headX * k, hy = fit.oy + set.cut.y * k - ENTER_GAP;
  const half = enter.offsetWidth / 2, x = Math.min(W - 16 - half, Math.max(16 + half, hx));
  enter.style.transform = `translate(${(x - half).toFixed(1)}px, ${(hy - enter.offsetHeight).toFixed(1)}px)`;
}

// ---------- input: mouse on desktop, tilt on phones, a slow drift underneath both ----------
let inX = 0, inY = 0, haveTilt = false, base = null;
addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  inX = e.clientX / innerWidth * 2 - 1; inY = e.clientY / innerHeight * 2 - 1;
});
function onTilt(e) {
  if (e.beta == null || e.gamma == null) return;
  haveTilt = true;
  if (!base) base = { b: e.beta, g: e.gamma };
  base.b += (e.beta - base.b) * 0.004; base.g += (e.gamma - base.g) * 0.004;   // slowly re-centres on how it's held
  const c = (v) => Math.max(-1, Math.min(1, v));
  inX = c((e.gamma - base.g) / TILT_DEG); inY = c((e.beta - base.b) / TILT_DEG);
}
addEventListener("deviceorientation", onTilt);
// iPhone asks permission for tilt; the first touch anywhere on the page asks it
addEventListener("touchstart", function ask() {
  removeEventListener("touchstart", ask);
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === "function") D.requestPermission().catch(() => {});
}, { passive: true });

// a soft spring so motion has weight instead of tracking the input 1:1
let px = 0, py = 0, vx = 0, vy = 0, t0 = null, last = 0;
function frame(now) {
  if (t0 === null) { t0 = now; last = now; }
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = (now - t0) / 1000;
  const drift = haveTilt ? 0.18 : 0.45;                // always a little life, more when there's no tilt
  const dX = drift * (Math.sin(t * 0.53) * 0.6 + Math.sin(t * 0.21 + 1.3) * 0.4);
  const dY = drift * (Math.sin(t * 0.37 + 0.7) * 0.6 + Math.sin(t * 0.17 + 2.1) * 0.4);
  const gx = Math.max(-1, Math.min(1, inX + dX)), gy = Math.max(-1, Math.min(1, inY + dY));
  vx += ((gx - px) * 26 - vx * 8.5) * dt; vy += ((gy - py) * 26 - vy * 8.5) * dt;
  px += vx * dt; py += vy * dt;
  const m = still ? 0 : 1, k = fit.k;

  // background: settles over the first 3 s, then holds exactly still for the transition
  const s = Math.min(1, t / INTRO_S), ease = 1 - Math.pow(1 - s, 3), rest = 1 - ease;
  plate.style.transform = rest > 0.0001 && m
    ? `translate(${(-px * INTRO_SHIFT * rest / k).toFixed(2)}px, ${(-py * INTRO_SHIFT * 0.6 * rest / k).toFixed(2)}px) scale(${(1 + INTRO_ZOOM * rest).toFixed(4)})`
    : "none";
  if (t > INTRO_S * 0.6) enter.classList.add("show");

  // TREV: his head leans toward the pointer/tilt in every direction; breathing lifts him slightly
  const breath = m * 2.2 / k * (0.5 - 0.5 * Math.cos(t / 5 * 2 * Math.PI));
  drawMe(px * HEAD_PX * m / k, py * HEAD_PX * 0.75 * m / k, breath);
  requestAnimationFrame(frame);
}

// preview of the hand-off: TREV dissolves, the loop keeps running underneath
enter.addEventListener("click", () => {
  canvas.classList.add("gone"); meImg.classList.add("gone");
  const note = document.getElementById("note"); setTimeout(() => note.classList.add("on"), 600);
  setTimeout(() => { note.classList.remove("on"); canvas.classList.remove("gone"); meImg.classList.remove("gone"); }, 3200);
});
if (matchMedia("(hover: hover)").matches) enter.firstElementChild.textContent = "Click to enter";
const menu = document.getElementById("menu");
document.getElementById("menuBtn").addEventListener("click", () => { menu.hidden = false; });
document.getElementById("menuClose").addEventListener("click", () => { menu.hidden = true; });
menu.addEventListener("click", (e) => { if (e.target.tagName === "A") { e.preventDefault(); menu.hidden = true; } });
document.fonts?.ready.then(layout);

addEventListener("resize", layout);
layout();
requestAnimationFrame(frame);
</script>
