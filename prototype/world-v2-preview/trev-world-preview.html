<title>TREV World Scroll</title>
<style>
  :root {
    --bg: #0b0c0f;
    --fg: #efe6d6;
    --gold: #f1cf97;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); margin: 0; }
  body { font-family: "Cinzel", Georgia, serif; }
  #track { height: 520svh; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
  #world { position: absolute; left: 0; top: 0; width: 941px; height: 1672px; transform-origin: 0 0; }
  #world img, #world .mist { position: absolute; left: 0; top: 0; width: 941px; max-width: none; will-change: transform; user-select: none; pointer-events: none; }
  #world img.sky { height: 1672px; }
  .mist { height: 1672px; background: linear-gradient(to bottom,
      rgba(222,214,232,0) 0px, rgba(222,214,232,0.07) 60px, rgba(222,214,232,0.25) 120px,
      rgba(222,214,232,0.5) 180px, rgba(222,214,232,0.75) 240px, rgba(222,214,232,0.92) 300px, rgba(222,214,232,0.92) 1672px); }
  #side { position: absolute; inset: 0; background: center/cover no-repeat; filter: blur(28px) brightness(.55); transform: scale(1.1); display: none; }
  #logo { position: absolute; left: 0; top: 0; max-width: none; pointer-events: none; filter: drop-shadow(0 2px 18px rgba(0,0,0,.45)); }
  #hint { position: absolute; left: 0; right: 0; bottom: calc(5svh + env(safe-area-inset-bottom, 0px)); text-align: center;
          font-size: 11px; letter-spacing: .42em; text-transform: uppercase; color: var(--fg); text-shadow: 0 1px 12px rgba(0,0,0,.6); }
  #bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--gold); width: 0; opacity: .8; }
  #pct { position: absolute; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); font: 11px/1 ui-monospace, monospace; color: var(--fg); opacity: .6; letter-spacing: 0; }
  @media (prefers-reduced-motion: reduce) { #hint { animation: none; } }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">

<div id="track"></div>
<div id="stage">
  <div id="side"></div>
  <div id="world"></div>
  <img id="logo" src="trev-logo.webp" alt="TREV">
  <div id="hint">Scroll to enter</div>
  <div id="pct"></div>
  <div id="bar"></div>
</div>

<script>
// TREV world, scroll test. The 941x1672 painting is cover-fit to the screen (a centred column on
// wide screens). Landing: sky + mandala with the cliff tops rising out of a low cloud bank.
// Scrolling is one descent D (900 -> 0 canvas px) that the whole ground follows, each layer at a
// slightly different multiple (nearer = a little faster) so it reads as depth, but never far enough
// apart to show a layer's edge. The trees slide in from the sides near the end.
const CANVAS = { w: 941, h: 1672 };
const SUN = { x: 487, y: 313 };                        // the sun in the painting
const LOGO = { src: "trev-logo.webp", aspect: 1280 / 667, ax: 0.5015, ay: 0.4418 }; // logo's sun core
const D0 = 900, DSPAN = [0, 0.9];
const LAYERS = [
  ["sky", 0], ["cliffs", 1.0], ["MIST"], ["groves", 1.04], ["pool", 1.07], ["bison", 1.07],
  ["stream", 1.1], ["aspens", "L"], ["juniper", "R"], ["fgleft", 1.14], ["fgright", 1.14],
];
const FILES = { sky: "01-sky", cliffs: "02-cliffs", groves: "03-groves", pool: "04-pool", bison: "05-bison",
  stream: "06-stream", aspens: "07-aspens", juniper: "08-juniper", fgleft: "09-fgleft", fgright: "10-fgright" };
const TREES = { from: 300, span: [0.55, 0.92] };
const MIST = { y0: 430, span: [0, 0.4] };

const world = document.getElementById("world");
const els = LAYERS.map(([k, m]) => {
  let el;
  if (k === "MIST") { el = document.createElement("div"); el.className = "mist"; }
  else { el = document.createElement("img"); el.src = `trev-world-${FILES[k]}.webp`; el.alt = ""; el.decoding = "async"; if (k === "sky") el.className = "sky"; }
  world.appendChild(el);
  return { k, m, el };
});
document.getElementById("side").style.backgroundImage = "url(trev-world-01-sky.webp)";

const ease = (t) => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };
const span = (p, [a, b]) => ease((p - a) / (b - a));

// heights that don't jump when the phone's address bar hides
let VW = 0, VH = 0;
function measure() {
  if (window.innerWidth !== VW) { VW = window.innerWidth; VH = window.innerHeight; }
  else VH = Math.max(VH, window.innerHeight);
}

let shown = -1, target = 0, cur = 0, raf = 0, last = performance.now();
function progress() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  return Math.max(0, Math.min(1, window.scrollY / Math.max(1, max)));
}
function layout(p) {
  measure();
  const narrow = VW / VH <= 0.8;
  const colW = narrow ? VW : Math.min(VW, VH * CANVAS.w / CANVAS.h);
  const k = Math.max(colW / CANVAS.w, VH / CANVAS.h);
  const ox = (VW - CANVAS.w * k) / 2, oy = (VH - CANVAS.h * k) / 2;
  document.getElementById("side").style.display = narrow ? "none" : "block";
  world.style.transform = `translate(${ox}px, ${oy}px) scale(${k})`;
  world.style.clipPath = narrow ? "" : `inset(0 ${(CANVAS.w * k - colW) / 2 / k}px)`;

  const D = D0 * (1 - span(p, DSPAN));
  let cliffDy = 0;
  for (const { k: key, m, el } of els) {
    let dx = 0, dy = 0;
    if (key === "MIST") {
      el.style.transform = `translate3d(0, ${(MIST.y0 + cliffDy).toFixed(1)}px, 0)`;
      el.style.opacity = (1 - span(p, MIST.span)).toFixed(3);
      continue;
    }
    if (m === "L" || m === "R") dx = (m === "L" ? -1 : 1) * TREES.from * (1 - span(p, TREES.span));
    else dy = D * m;
    if (key === "cliffs") cliffDy = dy;
    el.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0)`;
  }
  // the logo's sun sits on the painting's sun, fading out as you descend
  const logo = document.getElementById("logo");
  const lw = narrow ? colW * 0.82 : Math.min(600, Math.max(265, colW * 0.62));
  logo.style.width = lw + "px";
  logo.style.transform = `translate(${(ox + SUN.x * k - lw * LOGO.ax).toFixed(1)}px, ${(oy + SUN.y * k - (lw / LOGO.aspect) * LOGO.ay).toFixed(1)}px)`;
  const lo = 1 - span(p, [0.02, 0.16]);
  logo.style.opacity = lo.toFixed(3);
  document.getElementById("hint").style.opacity = lo.toFixed(3);
  document.getElementById("bar").style.width = (p * 100).toFixed(1) + "%";
  document.getElementById("pct").textContent = p.toFixed(2);
}
function frame(now) {
  raf = 0;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  target = progress();
  cur += (target - cur) * (1 - Math.exp(-dt * 5));
  if (Math.abs(target - cur) < 0.0003) cur = target;
  layout(cur);
  if (cur !== target) raf = requestAnimationFrame(frame);
}
const request = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };
addEventListener("scroll", request, { passive: true });
addEventListener("resize", () => { layout(cur); });
layout(0);
</script>
